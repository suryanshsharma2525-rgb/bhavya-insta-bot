name: POST NOW (Pinterest design + idea)

on:
  push:
    paths:
      - "inbox/**"          # inbox/ me Pinterest image daalte hi apne aap post + reel
  workflow_dispatch:
    inputs:
      idea:
        description: "Aapka idea (jaise: Baarish wali shaam, garma garam momos)"
        required: false
        default: ""
      item:
        description: "Item (optional) — jaise Kulhad Pizza"
        required: false
        default: ""
      type:
        description: "Kya chahiye? (reel = video, image = photo post, both = dono)"
        type: choice
        default: reel
        options: [reel, image, both]
      preset:
        description: "Post ka type"
        type: choice
        default: auto
        options: [auto, offer, combo, visit_now, new_item, weekend, rainy, exam, festival, late_night]
      offer:
        description: "Offer / combo ka text (optional) — jaise: Vada Pav + Cold Coffee ₹130"
        required: false
        default: ""
      style:
        description: "Kaunsa saved Pinterest design? (latest = sabse naya, random = baari-baari)"
        type: choice
        default: latest
        options: [latest, random]

permissions:
  contents: write

concurrency: daily-post

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: rembg-models-v1
      - run: pip install -r requirements.txt

      - name: Post / reel banao
        id: make
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IN_IDEA: ${{ inputs.idea }}
          IN_ITEM: ${{ inputs.item }}
          IN_TYPE: ${{ inputs.type || 'both' }}
          IN_STYLE: ${{ inputs.style || 'latest' }}
          IN_PRESET: ${{ inputs.preset || 'auto' }}
          IN_OFFER: ${{ inputs.offer }}
        run: |
          if ls inbox/*.jpg inbox/*.jpeg inbox/*.png inbox/*.webp >/dev/null 2>&1; then
            python -m pin.main make --type "$IN_TYPE" --idea "$IN_IDEA" --item "$IN_ITEM" --preset "$IN_PRESET" --offer "$IN_OFFER"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python -m pin.main idea --idea "$IN_IDEA" --item "$IN_ITEM" --type "$IN_TYPE" --style "$IN_STYLE" --preset "$IN_PRESET" --offer "$IN_OFFER"
          else
            echo "posts=" >> $GITHUB_OUTPUT
          fi

      - name: Repo me save karo
        run: |
          git config user.name "bhavya-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A posts data inbox assets
          git commit -m "Post: ${{ steps.make.outputs.posts }}" || echo "nothing"
          git pull --rebase -X theirs || true
          git push
          sleep 25

      - name: Instagram pe daalo
        if: steps.make.outputs.posts != ''
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python -m pin.main publish --dir "${{ steps.make.outputs.posts }}"

      - name: Link save karo
        if: always()
        run: |
          git add -A posts data
          git commit -m "Published" || echo "nothing"
          git pull --rebase -X theirs || true
          git push || true
