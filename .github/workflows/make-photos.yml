name: Make AI food photos (one time)

on:
  workflow_dispatch: {}   # Setup ke baad ek baar "Run workflow" dabao

permissions:
  contents: write

jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          POLLINATIONS_KEY: ${{ secrets.POLLINATIONS_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python -m bot.main make-photos
      - run: |
          git config user.name "bhavya-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A assets data
          git commit -m "AI food photos" || echo "nothing new"
          git pull --rebase || true
          git push
