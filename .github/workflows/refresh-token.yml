name: Refresh Instagram token (monthly)

on:
  schedule:
    - cron: "0 4 1 * *"    # har mahine ki 1 tareekh
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Token renew karo aur secret update karo
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          NEW=$(python -m bot.main refresh-token | tail -n 1)
          echo "::add-mask::$NEW"
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::GH_PAT secret nahi hai — token renew hua par save nahi hua. README ka Step 6 dekho."
            exit 1
          fi
          gh secret set IG_ACCESS_TOKEN --body "$NEW" --repo "$GITHUB_REPOSITORY"
