name: Daily Instagram post

on:
  schedule:
    - cron: "0 13 * * *"   # 13:00 UTC = 6:30 PM IST (GitHub kabhi-kabhi 10-20 min late chalata hai)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency: daily-post

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: rembg-models-v1
      - run: pip install -r requirements.txt

      - name: Aaj ka post (calendar ka idea + aapka saved Pinterest design + asli photo)
        id: make
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m pin.main daily

      - name: Repo me save karo
        run: |
          git config user.name "bhavya-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A .
          git commit -m "Daily post $(TZ=Asia/Kolkata date +%F)" || echo "nothing"
          git pull --rebase -X theirs || true
          git push
          sleep 25

      - name: Instagram pe daalo
        if: steps.make.outputs.posts != ''
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python -m pin.main publish --dir "${{ steps.make.outputs.posts }}"

      - name: Link save karo
        if: always()
        run: |
          git config user.name "bhavya-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A .
          git commit -m "Published $(TZ=Asia/Kolkata date +%F)" || echo "nothing"
          git pull --rebase -X theirs || true
          git push || true
